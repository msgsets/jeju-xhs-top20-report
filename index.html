<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>济州岛小红书高互动内容分析（Top 20）</title></head><body>
<p id="s">Loading report…</p>
<script>
(async () => {
  const base = "https://raw.githubusercontent.com/msgsets/jeju-xhs-top20-report/main/";
  const n = 4;
  let b64 = "";
  for (let i = 0; i < n; i++) {
    const r = await fetch(base + "gz_part_" + i + ".txt");
    if (!r.ok) throw new Error("part " + i + " " + r.status);
    b64 += (await r.text()).trim();
  }
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
})().catch(e => { document.getElementById("s").textContent = "Error: " + e; });
</script>
</body></html>
